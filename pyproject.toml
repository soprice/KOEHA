[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "koeha"
version = "0.2.4"
description = "Live Speech & Translation Studio"
requires-python = ">=3.12,<3.14"
license = "MIT"
dependencies = [
  "PySide6-Essentials>=6.8,<7",
  "numpy>=2,<3",
  "httpx>=0.28,<1",
  "av>=14,<20",
  "keyring>=25,<27",
  "PyAudioWPatch>=0.2.12,<1; sys_platform == 'win32'",
  "onnxruntime>=1.20,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.14,<0.15"]
desktop = ["pyinstaller>=6.16,<7"]

[project.scripts]
koeha = "koeha.__main__:main"

[project.urls]
Repository = "https://github.com/soprice/KOEHA"

[tool.hatch.build.targets.wheel]
packages = ["src/koeha"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
